<body>
<div id="wrap"><canvas id="c" aria-label="Robin Hoodwinked game"></canvas></div>
<div id="info"></div>

<div id="settings" hidden>
  <form class="card" onsubmit="return false">
    <h2>Royal Settings</h2>
    <fieldset class="mode"><legend>Aiming mode</legend>
      <label><input type="radio" name="mode" value="easy"> <b>Easy</b> — dots show the whole flight, wind included</label>
      <label><input type="radio" name="mode" value="hard"> <b>Hard</b> — dots show only the first quarter, wind not included</label>

    <label>Anthropic API key

    {speaker:2, claim:{type:'is_thief',target:0}, text:'Mistress Crumble did it! Grannies love pie!'}]},
  { villagers:[{name:'Bess the Milkmaid'},{name:'Sir Reginald Pants'},{name:'Odo the Fool'}], statements:[
    {speaker:0, claim:{type:'not_thief',target:2}, text:'Odo did not do it. He cannot even find his feet.'},
    {speaker:1, claim:{type:'not_thief',target:1}, text:'I did NOT take the pie. Do not look in my pants.'},
    {speaker:2, claim:{type:'not_thief',target:0}, text:'Bess did not do it. Honk honk!'}]},
  { villagers:[{name:'Baron von Crust'},{name:'Edith Two-Spoons'},{name:'Cuthbert'}], statements:[
    {speaker:0, claim:{type:'not_thief',target:0}, text:'I did not take the pie! I am a rich baron!'},
    {speaker:1, claim:{type:'not_thief',target:2}, text:'Cuthbert did not do it. He never has fun.'},
    {speaker:2, claim:{type:'not_thief',target:1}, text:'Edith did not do it. She only has spoons.'}]},
  { villagers:[{name:'Wise Old Wenda'},{name:'Tiny Tim the Tall'},{name:'Lady Larcenia'}], statements:[
    {speaker:0, claim:{type:'not_thief',target:1}, text:'Tiny Tim did not do it. He is very honest.'},
    {speaker:1, claim:{type:'not_thief',target:1}, text:'I did not take it. I only eat turnips.'},
    {speaker:2, claim:{type:'is_thief',target:1}, text:'Tiny Tim did it! He is tall enough to reach it!'}]},
  { villagers:[{name:'Squire Nibbles'},{name:'Duchess Fibberley'},{name:'Mungo the Quiet'}], statements:[
    {speaker:0, claim:{type:'not_thief',target:2}, text:'Mungo did not do it. He was asleep all day.'},
    {speaker:1, claim:{type:'is_thief',target:0}, text:'Squire Nibbles did it! He nibbles everything!'},
    {speaker:2, claim:{type:'not_thief',target:2}, text:'Mmmph. (I did not do it!)'}]},
];

// Returns every thief index consistent with the statements. Valid rounds have exactly one.
function solve(round){
  const out = [];
  for (let t = 0; t < 3; t++){
    const ok = round.statements.every(s => {
      const truth = s.claim.type === 'is_thief' ? s.claim.target === t : s.claim.target !== t;
      return s.speaker === t ? !truth : truth;
    });
    if (ok) out.push(t);
  }
  return out;
}
ROUNDS.forEach((r, i) => {
  const s = solve(r);
  if (s.length !== 1) console.error(`Round ${i+1} is not uniquely solvable (solutions: ${JSON.stringify(s)})`);
});

// ====================================================================
// HERALD LINES (offline)
// ====================================================================
const LINES = {

  win: [

  end: {
    'Village Idiot':        'The King has seen better shooting from a goat with its eyes shut.',
    'Squire':               'Not bad, not great. The King yawns.',

    'Legend of the Forest': 'A legend! People will sing songs about you!'}
};

const pick = a => a[Math.floor(Math.random() * a.length)];
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');

// ====================================================================
// SETUP, SCALING
// ====================================================================
const W = 1280, H = 720, GROUND = 620, GRAV = 620, MAXPULL = 220, MAXSPEED = 1400;
const VX = [830, 1000, 1165];
const SHOULDER = { x: 150, y: 478 };
const PLAYBTN = { x: 540, y: 478, w: 200, h: 66 };
const BTN_MUTE = { x: 1192, y: 23, r: 17 }, BTN_GEAR = { x: 1240, y: 23, r: 17 };
const FONT_T = "'Pirata One', 'MedievalSharp', Georgia, serif";
const FONT_B = "'Alegreya Sans', 'Trebuchet MS', Arial, sans-serif";

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SCALE = 1;
function fit(){
  const portrait = innerHeight > innerWidth;
  const maxW = innerWidth - (portrait ? 0 : 8), maxH = portrait ? innerHeight * 0.6 : innerHeight - 8;
  let w = maxW, h = w * 9 / 16;
  if (h > maxH){ h = maxH; w = h * 16 / 9; }
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  SCALE = cv.width / W;
}
addEventListener('resize', fit); fit();

// ====================================================================
// AUDIO (Web Audio blips)
// ====================================================================
let AC = null, noiseBuf = null, muted = false;
function audio(){
  if (!AC){
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const n = AC.sampleRate * 1.5;
      noiseBuf = AC.createBuffer(1, n, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(type, f0, f1, dur, vol, delay = 0){
  if (muted || !AC) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.05);
}
function noise(dur, vol, ftype, freq, q, attack){
  if (muted || !AC) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = ftype; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur + 0.05);
}
const SFX = {
  twang(){ tone('triangle', 330, 90, 0.28, 0.35); tone('sawtooth', 700, 200, 0.07, 0.06); },
  splat(){ noise(0.28, 0.6, 'lowpass', 900, 1, 0.004); tone('sine', 190, 55, 0.18, 0.3); },
  thud(){ noise(0.12, 0.45, 'lowpass', 320, 1, 0.002); },
  boing(){
    if (muted || !AC) return;
    const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(), l = AC.createOscillator(), lg = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(520, t + 0.12);
    o.frequency.exponentialRampToValueAtTime(170, t + 0.45);
    l.frequency.value = 18; lg.gain.value = 40; l.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.connect(g).connect(AC.destination); o.start(t); l.start(t); o.stop(t + 0.55); l.stop(t + 0.55);
  },
  cheer(){ noise(1.5, 0.3, 'bandpass', 1300, 0.7, 0.18); noise(1.1, 0.15, 'bandpass', 2600, 1.5, 0.1);
           [523, 659, 784, 1047].forEach((f, i) => tone('square', f, f, 0.16, 0.06, i * 0.1)); },
  gasp(){ noise(0.6, 0.35, 'highpass', 2200, 0.7, 0.25); },
  boo(){ tone('sawtooth', 160, 90, 0.9, 0.12); noise(0.9, 0.15, 'lowpass', 500, 1, 0.2); },
  trumpet(){ [392, 523, 659].forEach((f, i) => tone('square', f, f * 1.01, 0.14, 0.05, i * 0.12)); },
};
function toggleMute(){ muted = !muted; }

// ====================================================================
// GAME STATE
// ====================================================================
const G = {
  screen: 'title', round: 0, score: 0, arrowsLeft: 3, wind: 0, thief: 0, data: null,
  vill: [], stmts: [], phase: 'aim', aim: null, arrow: null, lastAng: -0.3,
  stuck: [], particles: [], timers: [], pie: null,
  king: { t: 0, dur: 3.6 }, crowd: { mood: 'idle', t: 0 },
  herald: { text: '', shown: 0 }, banner: { text: '', t: 0 },
  gen: null, physAcc: 0, best: 0, rank: '', endLine: '', time: 0,
};
try { G.best = +localStorage.getItem('robinHoodwinkedBest') || 0; } catch (e) {}
// Aiming difficulty: easy = exact full-path preview with wind; hard = first 25% of the arc, no wind (original spec).
let MODE = 'easy';
try { if (localStorage.getItem('robinHoodwinkedMode') === 'hard') MODE = 'hard'; } catch (e) {}
function setMode(m){ MODE = m === 'hard' ? 'hard' : 'easy'; try { localStorage.setItem('robinHoodwinkedMode', MODE); } catch (e) {} }

const later = (sec, fn) => G.timers.push({ t: sec, fn });

const TUNICS = ['#c0392b','#2e86c1','#8e44ad','#d68910','#1e8449','#a04000','#5d6d7e','#d35400','#117a65'];
const SKINS = ['#f5cba7','#e0ac69','#c68642','#8d5524','#f1c27d'];
const HATS = ['pointy','beret','bucket','feather','hood','crown'];
const HATH = { pointy: 36, beret: 14, bucket: 24, feather: 18, hood: 16, crown: 20 };
function hash(s){ let h = 2166136261; for (const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function makeVillager(v, i){
  const h = hash(v.name);
  return { name: v.name, letter: 'ABC'[i], x: VX[i],
    tunic: TUNICS[h % 9], skin: SKINS[(h >>> 4) % 5], hat: HATS[(h >>> 8) % 6], hatCol: TUNICS[(h >>> 12) % 9],
    bodyH: 52 + ((h >>> 16) % 14), beard: ((h >>> 20) % 3) === 0, seed: (h % 1000) / 250,
    apple: true, fainted: false, faint: 0, hop: 0, hopV: 0, stuck: [], running: false, run: 0, hasPie: false,
    mood: '', moodT: 0 };
}
function geo(v){
  const shoulder = -(34 + v.bodyH), headC = shoulder - 15, headTop = headC - 17,
        hatTop = headTop - HATH[v.hat] + 5, appleY = hatTop - 13;
  return { shoulder, headC, headTop, hatTop, appleY };
}
const applePos = v => ({ x: v.x, y: GROUND - v.hop + geo(v).appleY });
const groundAt = x => x < 350 ? Math.min(GROUND, 560 + ((x - 150) / 200) ** 2 * 60) : GROUND;
G.vill = ROUNDS[0].villagers.map(makeVillager);

// ====================================================================
// FLOW
// ====================================================================
function startGame(){
  G.score = 0; G.timers = []; G.particles = []; G.round = 0; G.screen = 'play';
  if (G.gen && G.gen.forRound !== 1) G.gen = null;
  SFX.trumpet();
  startRound(1);
}
function startRound(n){
  G.round = n;
  let data = ROUNDS[n - 1];
  if (G.gen && G.gen.forRound === n){ data = G.gen.data; }
  G.gen = null;
  G.data = data;
  G.vill = data.villagers.map(makeVillager);
  G.stmts = [0, 1, 2].map(i => data.statements.find(s => s.speaker === i));
  G.thief = solve(data)[0];
  G.arrowsLeft = 3; G.stuck = []; G.pie = null; G.arrow = null; G.aim = null; G.phase = 'aim';
  G.wind = n <= 3 ? 0 : (Math.random() < 0.5 ? -1 : 1) * (30 + (n - 3) * 18) * (0.45 + Math.random() * 0.55);
  G.banner = { text: `Round ${n}`, t: 1.8 };
  heraldSay('roundStart', { round: n },
    `Round ${n} of 10 begins. Suspects: ${G.vill.map(v => v.name).join(', ')}. ${G.wind ? 'The wind is blowing.' : 'No wind.'}`);
  if (n < 10) fetchGenRound(n + 1);
}
function nextRound(){
  if (G.round >= 10) endGame(); else startRound(G.round + 1);
}
function rankFor(s){ return s < 400 ? 'Village Idiot' : s < 800 ? 'Squire' : s < 1200 ? 'Royal Archer' : 'Legend of the Forest'; }
function endGame(){
  G.screen = 'end'; G.phase = 'wait'; G.arrow = null;
  G.rank = rankFor(G.score);
  G.newBest = G.score > G.best;
  if (G.newBest){ G.best = G.score; try { localStorage.setItem('robinHoodwinkedBest', String(G.score)); } catch (e) {} }
  G.endLine = LINES.end[G.rank];
  setHerald(G.endLine);
  if (API_KEY && OPT.herald){
    const id = ++heraldId;
    claude(HERALD_SYS, `The tournament is over. The archer scored ${G.score} points and earned the rank "${G.rank}". Give your verdict.`, 80, 3000)
      .then(l => { if (id === heraldId && l){ G.endLine = cleanLine(l); setHerald(G.endLine); } });
  }
  if (G.rank === 'Legend of the Forest') confetti(640);
  SFX.trumpet();
  fetchGenRound(1);
}

function release(){
  const a = G.aim; G.aim = null;
  const v = aimVelocity(a);
  if (!v) return;
  G.arrow = launchState(v); G.physAcc = 0;
  G.lastAng = G.arrow.ang;
  G.arrowsLeft--; G.phase = 'flight';
  SFX.twang();
}
function aimVelocity(a){
  if (!a) return null;
  const dx = a.sx - a.x, dy = a.sy - a.y, len = Math.hypot(dx, dy);
  if (len < 15) return null;
  const pull = Math.min(len, MAXPULL), speed = pull / MAXPULL * MAXSPEED;
  return { vx: dx / len * speed, vy: dy / len * speed, speed, pull: pull / MAXPULL };
}

function afterShot(){

// ====================================================================
// UPDATE
// ====================================================================
function update(dt){
  G.time += dt;
  for (const tm of G.timers.slice()){
    tm.t -= dt;
    if (tm.t <= 0){ G.timers.splice(G.timers.indexOf(tm), 1); tm.fn(); }
  }
  if (G.arrow) updateArrow(dt);
  for (const v of G.vill){
    if (v.hop > 0 || v.hopV){ v.hopV += 1800 * dt; v.hop -= v.hopV * dt; if (v.hop <= 0){ v.hop = 0; v.hopV = v.hopV > 300 ? -v.hopV * 0.35 : 0; } }
    if (v.faint > 0 && v.faint < 1) v.faint = Math.min(1, v.faint + dt * 1.6);
    if (v.moodT > 0){ v.moodT -= dt; if (v.moodT <= 0) v.mood = ''; }
    if (v.running) v.run += 300 * dt;
  }
  if (G.pie){
    const p = G.pie;
    p.vy += 1500 * dt; p.y += p.vy * dt; p.x -= 30 * dt * (p.vy !== 0);
    if (p.y >= GROUND - 8){ p.y = GROUND - 8; p.vy = Math.abs(p.vy) > 150 ? -p.vy * 0.35 : 0; }
  }
  if (G.king.t > 0) G.king.t -= dt;
  if (G.crowd.t > 0){ G.crowd.t -= dt; if (G.crowd.t <= 0) G.crowd.mood = 'idle'; }
  if (G.banner.t > 0) G.banner.t -= dt;
  G.herald.shown += dt * 55;
  for (const c of CLOUDS){ c.x += (10 + G.wind * 0.3) * dt; if (c.x > W + 150) c.x = -150; if (c.x < -150) c.x = W + 150; }
  for (let i = G.particles.length - 1; i >= 0; i--){
    const p = G.particles[i];
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.vr) p.rot += p.vr * dt;
    if (p.type === 'conf'){ p.x += Math.sin(G.time * 4 + p.ph) * 40 * dt + G.wind * 0.2 * dt; p.vy = Math.min(p.vy, 140); }
    if (p.life <= 0 || p.y > H + 30) G.particles.splice(i, 1);
  }
}
// Fixed-step physics shared by the real arrow and the aim preview, so the dots are exact.
const PHYS_DT = 1 / 300;
function stepArrow(a, wind = G.wind){
  a.vx += wind * PHYS_DT; a.vy += GRAV * PHYS_DT; a.x += a.vx * PHYS_DT; a.y += a.vy * PHYS_DT;
}
function launchState(v){
  const dir = { x: v.vx / v.speed, y: v.vy / v.speed };
  return { x: SHOULDER.x + dir.x * 62, y: SHOULDER.y + dir.y * 62, vx: v.vx, vy: v.vy, ang: Math.atan2(v.vy, v.vx) };
}
// What the arrow tip touches at its current position (shared by flight and aim preview).
function arrowHit(a){
  for (let i = 0; i < 3; i++){
    const v = G.vill[i];
    if (!v.apple || v.running) continue;
    const p = applePos(v);
    if (Math.hypot(a.x - p.x, a.y - p.y) < 19) return { type: 'apple', i };
  }
  for (let i = 0; i < 3; i++){
    const v = G.vill[i];
    if (v.fainted || v.running) continue;
    const g = geo(v), top = GROUND - v.hop + g.hatTop, bot = GROUND - v.hop;
    if (a.x > v.x - 22 && a.x < v.x + 22 && a.y > top && a.y < bot) return { type: 'body', i };
  }
  if (a.y >= groundAt(a.x)) return { type: 'ground' };
  if (a.x > W + 60 || a.x < -60 || a.y > H + 60) return { type: 'off' };
  return null;
}
function updateArrow(dt){
  const a = G.arrow;
  G.physAcc += dt;
  while (G.physAcc >= PHYS_DT){
    G.physAcc -= PHYS_DT;
    stepArrow(a);
    a.ang = Math.atan2(a.vy, a.vx);
    const hit = arrowHit(a);
    if (!hit) continue;
    if (hit.type === 'apple') hitApple(hit.i);
    else if (hit.type === 'body') hitBody(hit.i);
    else missShot(hit.type === 'ground');
    return;
  }
}

function rr(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
const wrapCache = new Map();
function wrap(text, maxW, font){
  const key = font + '|' + maxW + '|' + text;
  if (wrapCache.has(key)) return wrapCache.get(key);
  ctx.font = font;
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words){
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  wrapCache.set(key, lines);
  return lines;
}
if (document.fonts) document.fonts.addEventListener('loadingdone', () => wrapCache.clear());
function bounce(x){
  const n1 = 7.5625, d1 = 2.75;
  if (x < 1 / d1) return n1 * x * x;
  if (x < 2 / d1) return n1 * (x -= 1.5 / d1) * x + 0.75;
  if (x < 2.5 / d1) return n1 * (x -= 2.25 / d1) * x + 0.9375;
  return n1 * (x -= 2.625 / d1) * x + 0.984375;
}

  ctx.fillStyle = '#c0392b';

  ctx.fillStyle = '#fff';

  ctx.font = `800 30px ${FONT_B}`; ctx.fillStyle = '#3b230f'; ctx.fillText(`Final score: ${G.score}`, 640, 232);
  ctx.font = `20px ${FONT_B}`; ctx.fillText('Your rank:', 640, 275);
  ctx.font = `64px ${FONT_T}`; ctx.lineWidth = 6; ctx.strokeStyle = '#5b2a0e';
  ctx.strokeText(G.rank, 640, 345); ctx.fillStyle = '#f4c430'; ctx.fillText(G.rank, 640, 345);
  ctx.font = `700 20px ${FONT_B}`; ctx.fillStyle = G.newBest ? '#1e8449' : '#5b2a0e';
  ctx.fillText(G.newBest ? `New best score! (${G.best})` : `Best score: ${G.best}`, 640, 390);
  ctx.font = `italic 600 19px ${FONT_B}`; ctx.fillStyle = '#3b230f';
  wrap(G.endLine, 540, `italic 600 19px ${FONT_B}`).forEach((l, i) => ctx.fillText(l, 640, 428 + i * 24));
  drawButton(PLAYBTN, 'Play again', t);
}
function draw(){
  const t = G.time;
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  drawBackground(t);
  drawStuckGround();
  drawHill();
  drawCrowd(t);
  drawArcher(t);
  const order = [0, 1, 2].sort((a, b) => G.vill[a].running - G.vill[b].running);
  for (const i of order) drawVillager(G.vill[i], t);
  if (G.pie) drawPie(G.pie.x, G.pie.y);
  if (G.arrow) drawArrowShape(G.arrow.x, G.arrow.y, G.arrow.ang);
  if (G.screen === 'play'){
    G.vill.forEach((v, i) => drawBubble(v, G.stmts[i]));
    drawPreview();
  }
  drawParticles();
  drawKing(t);
  drawTopBar();
  drawHerald(t);
  if (G.screen === 'play' && G.banner.t > 0){
    const a = Math.min(1, G.banner.t * 2), s = 1 + (1.8 - G.banner.t) * 0.08;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(560, 250); ctx.scale(s, s);
    ctx.font = `86px ${FONT_T}`; ctx.textAlign = 'center'; ctx.lineWidth = 8; ctx.strokeStyle = '#5b2a0e';
    ctx.strokeText(G.banner.text, 0, 0); ctx.fillStyle = '#f4c430'; ctx.fillText(G.banner.text, 0, 0); ctx.restore();
  }
  if (G.screen === 'title') drawTitle(t);
  if (G.screen === 'end') drawEnd(t);
}

// ====================================================================
// HERALD (local lines, optionally Claude)
// ====================================================================
let heraldId = 0;
function setHerald(text){ G.herald = { text, shown: 0 }; }
function cleanLine(l){
  l = l.split('\n').map(s => s.trim()).filter(Boolean)[0] || '';
  return l.replace(/^["'“”]+|["'“”]+$/g, '').slice(0, 180);
}
function heraldSay(kind, vars, eventDesc){
  const local = fill(pick(LINES[kind]), vars);
  const id = ++heraldId;
  if (!(API_KEY && OPT.herald)){ setHerald(local); return; }
  setHerald('*The herald clears his throat…*');
  claude(HERALD_SYS, eventDesc, 70, 3000).then(line => {
    if (id !== heraldId) return;
    setHerald(line ? cleanLine(line) || local : local);
  });
}

// ====================================================================
// CLAUDE (stretch) — key lives in memory only
// ====================================================================
let API_KEY = '';
const OPT = { herald: true, rounds: true };
const HERALD_SYS = 'You are the pompous, sarcastic royal herald at a chaotic medieval archery fair. ' +
  'An archer must work out which villager stole the King\'s pie (the thief always lies) and shoot the apple off the thief\'s head. ' +
  'Given a game event, reply with ONE short, funny line of at most 20 words. Use simple, everyday English a 10-year-old understands. No quotes, no stage directions, family-friendly.';
const ROUND_SYS = 'You write logic puzzles for a medieval comedy archery game. Reply with ONLY a JSON object, no prose, no code fences, in exactly this shape:\n' +
  '{"villagers":[{"name":"..."},{"name":"..."},{"name":"..."}],"statements":[{"speaker":0,"claim":{"type":"is_thief","target":1},"text":"..."},{"speaker":1,"claim":{"type":"not_thief","target":1},"text":"..."},{"speaker":2,"claim":{"type":"not_thief","target":0},"text":"..."}]}\n' +
  'Rules: exactly one of the three villagers stole the King\'s pie. The thief\'s statement is FALSE; both innocent villagers\' statements are TRUE. ' +
  'claim.type is "is_thief" (the target stole the pie) or "not_thief" (the target did not); target is 0, 1 or 2 and may be the speaker themself. ' +
  'Exactly one villager must be consistent as the thief. Each villager speaks exactly once. ' +
  'Names: silly medieval names, max 18 characters. Text: funny, in simple everyday English a 10-year-old understands, max 60 characters, must say exactly what the claim says, refer to others by name and to themself as "I".';
async function claude(system, user, maxTokens, timeoutMs){
  if (!API_KEY) return null;
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), timeoutMs);
  try {
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal: ctl.signal,
      headers: { 'x-api-key': API_KEY, 'anthropic-version': '2023-06-01', 'content-type': 'application/json',
                 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-haiku-5-5', max_tokens: maxTokens, system, messages: [{ role: 'user', content: user }] }),
    });
    if (!r.ok) return null;
    const j = await r.json();
    const text = (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
    return text || null;
  } catch (e) { return null; }
  finally { clearTimeout(tm); }
}
function validateRound(d){
  if (!d || !Array.isArray(d.villagers) || !Array.isArray(d.statements) || d.villagers.length !== 3 || d.statements.length !== 3) return null;
  const villagers = d.villagers.map(v => ({ name: String(v && v.name || '').trim().slice(0, 22) }));
  if (villagers.some(v => !v.name)) return null;
  const seen = new Set(), statements = [];
  for (const s of d.statements){
    if (!s || !s.claim) return null;
    const sp = s.speaker, tg = s.claim.target, ty = s.claim.type;
    if (![0, 1, 2].includes(sp) || ![0, 1, 2].includes(tg) || !['is_thief', 'not_thief'].includes(ty) || seen.has(sp)) return null;
    if (typeof s.text !== 'string' || !s.text.trim()) return null;
    seen.add(sp);
    statements.push({ speaker: sp, claim: { type: ty, target: tg }, text: s.text.trim().slice(0, 90) });
  }
  const r = { villagers, statements };
  return solve(r).length === 1 ? r : null;
}
async function fetchGenRound(n){
  if (!API_KEY || !OPT.rounds) return;
  const level = n <= 3 ? 'Easy: an honest villager directly accuses the real thief.'
              : n <= 6 ? 'Medium: mix accusations and denials.'
              : 'Hard: use mostly denials and "X is innocent" claims so the player must rule people out.';
  const txt = await claude(ROUND_SYS, `Write round ${n} of 10. ${level} Use fresh names. Random seed ${Math.floor(Math.random() * 1e6)}.`, 500, 15000);
  if (!txt) return;
  let data;
  try { data = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1)); } catch (e) { return; }
  const r = validateRound(data);
  const stillWanted = G.screen === 'play' ? G.round < n : n === 1;
  if (r && stillWanted) G.gen = { forRound: n, data: r };
}

// settings panel
const $ = id => document.getElementById(id);
function openSettings(){ $('settings').hidden = false; $('key').value = API_KEY; $('optHerald').checked = OPT.herald; $('optRounds').checked = OPT.rounds; document.querySelector(`input[name=mode][value=${MODE}]`).checked = true; $('status').textContent = API_KEY ? 'A key is set (in memory only).' : 'No key: the herald uses his built-in jokes.'; }
function closeSettings(){ $('settings').hidden = true; }
$('btnSave').onclick = () => {
  API_KEY = $('key').value.trim(); OPT.herald = $('optHerald').checked; OPT.rounds = $('optRounds').checked;
  $('status').textContent = API_KEY ? 'Saved. Claude will be consulted (with offline fallback).' : 'No key: offline mode.';
  if (API_KEY) fetchGenRound(G.screen === 'play' ? G.round + 1 : 1);
  setTimeout(closeSettings, 700);
};
$('btnForget').onclick = () => { API_KEY = ''; G.gen = null; $('key').value = ''; $('status').textContent = 'Key forgotten. Offline mode.'; };
$('btnClose').onclick = closeSettings;
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', () => setMode(r.value)));
$('settings').addEventListener('pointerdown', e => { if (e.target.id === 'settings') closeSettings(); });

// ====================================================================
// INPUT
// ====================================================================
function toLogical(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const inCircle = (p, b) => Math.hypot(p.x - b.x, p.y - b.y) <= b.r + 6;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const p = toLogical(e);
  if (inCircle(p, BTN_GEAR)){ openSettings(); return; }
  if (inCircle(p, BTN_MUTE)){ toggleMute(); return; }
  if (G.screen !== 'play'){
    if (G.screen === 'title' && inRect(p, MODEBTN)) setMode(MODE === 'hard' ? 'easy' : 'hard');
    else if (inRect(p, PLAYBTN)) startGame();
    return;
  }
  if (G.phase === 'aim' && G.arrowsLeft > 0 && !G.arrow){
    G.aim = { sx: p.x, sy: p.y, x: p.x, y: p.y, id: e.pointerId };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  }
});
cv.addEventListener('pointermove', e => {
  if (!G.aim || e.pointerId !== G.aim.id) return;
  const p = toLogical(e); G.aim.x = p.x; G.aim.y = p.y;
});
cv.addEventListener('pointerup', e => {
  if (!G.aim || e.pointerId !== G.aim.id) return;
  const p = toLogical(e); G.aim.x = p.x; G.aim.y = p.y;
  if (G.phase === 'aim') release(); else G.aim = null;
});
cv.addEventListener('pointercancel', () => { G.aim = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') { if (e.key === 'Escape') closeSettings(); return; }
  if (e.key === 'm' || e.key === 'M') toggleMute();
  else if (e.key === 'Escape') closeSettings();
  else if ((e.key === 'Enter' || e.key === ' ') && G.screen !== 'play'){ e.preventDefault(); audio(); startGame(); }
});

// ====================================================================
// PHONE PANEL (portrait): statements & herald in readable HTML
// ====================================================================
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let infoCache = '';
function updateInfo(){
  let html;
  if (G.screen === 'play'){
    const s = Math.round(Math.abs(G.wind) / 20);
    html = `<div class="bar">Round ${G.round}/10 · Score ${G.score} · Arrows ${G.arrowsLeft} · Wind ${s ? (G.wind < 0 ? '← ' : '→ ') + s : 'calm'}</div>` +
      G.vill.map((v, i) => `<div class="st"><b>${v.letter} — ${esc(v.name)}${v.fainted ? ' (fainted)' : ''}:</b> “${esc(G.stmts[i] ? G.stmts[i].text : '')}”</div>`).join('');
  } else if (G.screen === 'end'){
    html = `<div class="bar">Final score ${G.score} — ${esc(G.rank)}</div>`;
  } else {
    html = `<div class="bar">Robin Hoodwinked — Shoot the liar</div><div>The thief always lies; the innocent tell the truth. Tap Play, then drag back from the archer to aim. Rotate your phone sideways for a bigger field.</div>`;
  }
  html += `<div class="herald">📜 ${esc(G.herald.text)}</div>`;
  if (html !== infoCache){ infoCache = html; $('info').innerHTML = html; }
}

// ====================================================================
// LOOP
// ====================================================================
let last = performance.now(), infoT = 0;
setHerald('Welcome, archer! Find the liar and save the King\'s pie!');
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  draw();
  if ((infoT -= dt) <= 0){ infoT = 0.25; updateInfo(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
